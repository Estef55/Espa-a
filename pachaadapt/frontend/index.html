<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="PACHAADAPT by YACHAY - plataforma educativa accesible">
<title>PACHAADAPT by YACHAY</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f5;color:#20312c}button,input,select{font:inherit}button{cursor:pointer}.top{height:70px;background:#fff;border-bottom:1px solid #e1e8e4;display:flex;align-items:center;padding:0 25px;gap:15px;position:sticky;top:0;z-index:10}.logo{display:flex;align-items:center;gap:10px;font-weight:800}.mark{width:38px;height:38px;border-radius:11px;background:#236b58;color:white;display:grid;place-items:center;font-size:20px}.logo small{display:block;color:#84958d;font-size:9px;letter-spacing:1px}.topright{margin-left:auto;display:flex;align-items:center;gap:15px}.avatar{width:35px;height:35px;border-radius:50%;background:#e6f1eb;color:#236b58;display:grid;place-items:center;font-weight:bold}.layout{display:flex}.side{width:240px;background:#fff;border-right:1px solid #e1e8e4;min-height:calc(100vh - 70px);padding:18px 12px;position:fixed;top:70px;bottom:0}.role{background:#f0f5f2;padding:10px;border-radius:10px;margin-bottom:15px}.role small{display:block;color:#82938c;font-size:10px;margin-bottom:4px}.role select{width:100%;border:0;background:transparent;font-weight:bold;color:#31564a}.nav button{width:100%;padding:11px;border:0;background:transparent;text-align:left;border-radius:9px;color:#65776f;font-weight:600;margin:2px 0}.nav button:hover,.nav .active{background:#e8f3ed;color:#216950}.main{margin-left:240px;padding:35px;max-width:1500px;width:100%}.eyebrow{color:#5c8878;font-size:10px;font-weight:bold;letter-spacing:1.5px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.title h1{margin:5px 0;font-size:30px}.title p{margin:0;color:#7c8d85;font-size:14px}.primary{border:0;background:#236b58;color:white;padding:11px 17px;border-radius:9px;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.card,.stat{background:#fff;border:1px solid #e1e8e4;border-radius:14px;padding:18px}.stat strong{display:block;color:#236b58;font-size:27px}.stat span{font-size:12px;color:#788a82}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card h2{font-size:16px;margin:0 0 4px}.muted{color:#87978f;font-size:12px}.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.quick{border:1px solid #e2e9e5;background:#fbfcfb;border-radius:11px;padding:15px;text-align:left;min-height:100px}.quick b,.quick small{display:block}.quick small{color:#87978f;font-size:11px;margin-top:5px}.activity{margin-top:10px}.activity div{padding:13px 0;border-bottom:1px solid #edf0ee}.activity b{font-size:12px}.activity p{font-size:11px;color:#87978f;margin:4px 0}.searchbar{display:flex;gap:10px;margin-bottom:18px}.searchbar input{flex:1;border:1px solid #dce5e0;border-radius:9px;padding:11px;background:#fff}.upload{border:1px dashed #9fc4b4;background:#f1f8f4;padding:16px;border-radius:12px;margin-bottom:18px}.materials{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.material{background:#fff;border:1px solid #e1e8e4;border-radius:12px;padding:17px}.badge{display:inline-block;padding:5px 8px;border-radius:6px;background:#edf4f0;color:#276d59;font-size:10px;font-weight:bold}.material h3{font-size:13px;line-height:1.4}.material p{font-size:11px;color:#84938d}.rows{background:#fff;border:1px solid #e1e8e4;border-radius:13px;overflow:hidden}.row{padding:15px 18px;border-bottom:1px solid #edf0ee;display:flex;align-items:center;gap:12px}.row:last-child{border:0}.row small{display:block;color:#899891;margin-top:3px}.row button{margin-left:auto;border:0;background:transparent;color:#71837b}.toast{position:fixed;right:20px;bottom:20px;background:#203c34;color:#fff;padding:12px 16px;border-radius:9px;z-index:20;font-size:12px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf5f0,#f8faf7)}.loginbox{width:min(460px,100%);background:white;padding:32px;border-radius:18px;border:1px solid #e1e8e4}.loginbox h1{font-size:27px}.loginbox p{color:#7d8d86;font-size:13px;line-height:1.5}.loginbox label{display:block;font-size:11px;font-weight:bold;margin:12px 0}.loginbox input,.loginbox select{display:block;width:100%;padding:11px;margin-top:5px;border:1px solid #dce5e0;border-radius:8px}.wide{width:100%;margin-top:10px}.lang{border:0;background:transparent;color:#356c59;font-weight:bold}.mobile{display:none;border:0;background:transparent;font-size:22px}@media(max-width:900px){.grid{grid-template-columns:1fr}.materials{grid-template-columns:1fr 1fr}}@media(max-width:700px){.mobile{display:block}.side{left:-250px;transition:.2s}.side.open{left:0;z-index:9}.main{margin-left:0;padding:22px 15px}.stats{grid-template-columns:1fr 1fr}.materials{grid-template-columns:1fr}.title{align-items:flex-start;flex-direction:column;gap:15px}.top{padding:0 15px}.topright .usertext{display:none}}
</style></head><body><div id="app"></div>
<script>
const app=document.getElementById('app');let role='Docente',page='Inicio',lang='Español',open=false,query='',notice='';
const data={Instituciones:['I.E. Yachay','I.E. José María Arguedas','I.E. Nuestra Señora del Carmen'],Usuarios:['María Quispe · Docente','Luis Huamán · Docente','Ana Flores · Estudiante'],Grupos:['3.º Secundaria A','4.º Secundaria B','6.º Primaria A'],Niveles:['Primaria','Secundaria','Categoría pendiente de validar'],Grados:['1.º','2.º','3.º','4.º','5.º','6.º'],Aulas:['Aula A · 3.º Secundaria','Aula B · 4.º Secundaria','Aula C · 6.º Primaria'],Áreas:['Comunicación','Matemática','Ciencia y Tecnología','Personal Social'],Temas:['Comprensión lectora','Fracciones','Ecosistemas','Identidad cultural']};
let mats=[['PDF','Comunicación - Comprensión lectora','Comunicación','Secundaria'],['PPT','Matemática - Fracciones','Matemática','Primaria'],['DOC','Ciencia y Tecnología - Ecosistemas','Ciencia y Tecnología','Secundaria'],['PDF','Actividad: Identidad cultural','Personal Social','Primaria']];
const nav={Docente:[['⌂','Inicio'],['♙','Grupos'],['▦','Aulas'],['▤','Biblioteca'],['◈','Áreas'],['◇','Temas']],Estudiante:[['⌂','Inicio'],['▦','Aulas'],['▤','Biblioteca'],['◇','Temas']],Administrador:[['⌂','Inicio'],['⌂','Instituciones'],['♙','Usuarios'],['♧','Grupos'],['≡','Niveles'],['▥','Grados'],['▦','Aulas'],['◈','Áreas'],['◇','Temas'],['▤','Biblioteca']]};
function toast(t){notice=t;render();setTimeout(()=>{notice='';render()},2200)}
function render(){if(page==='LOGIN'){login();return}app.innerHTML=`<header class="top"><button class="mobile" onclick="toggleSide()">☰</button><div class="logo"><span class="mark">P</span><div>PACHAADAPT<small>BY YACHAY</small></div></div><div class="topright"><select class="lang" onchange="setLang(this.value)"><option ${lang==='Español'?'selected':''}>Español</option><option ${lang==='Quechua'?'selected':''}>Quechua</option></select><div class="avatar">Y</div><span class="usertext"><b>${role}</b></span></div></header><div class="layout"><aside class="side ${open?'open':''}"><div class="role"><small>ROL ACTUAL</small><select onchange="setRole(this.value)"><option ${role==='Docente'?'selected':''}>Docente</option><option ${role==='Estudiante'?'selected':''}>Estudiante</option><option ${role==='Administrador'?'selected':''}>Administrador</option></select></div><div class="nav">${nav[role].map(x=>`<button class="${page===x[1]?'active':''}" onclick="go('${x[1]}')">${x[0]} &nbsp; ${x[1]}</button>`).join('')}</div><button class="nav" style="margin-top:15px" onclick="page='LOGIN';render()">↪ Cerrar sesión</button></aside><main class="main">${notice?`<div class="toast">${notice}</div>`:''}${page==='Inicio'?dashboard():page==='Biblioteca'?library():management()}</main></div>`}
function dashboard(){let stats=role==='Administrador'?[['3','Instituciones'],['18','Docentes'],['12','Grupos'],['46','Aulas']]:role==='Estudiante'?[['3','Cursos'],['12','Materiales'],['8','Actividades'],['4','Temas nuevos']]:[['4','Grupos activos'],['28','Materiales'],['86','Estudiantes'],['7','Temas']];return `<div class="title"><div><div class="eyebrow">PANEL DE ${role.toUpperCase()}</div><h1>Buenos días 👋</h1><p>Todo lo que necesitas para organizar y acompañar el aprendizaje.</p></div><button class="primary" onclick="go('${role==='Administrador'?'Instituciones':'Biblioteca'}')">${role==='Administrador'?'Gestionar institución':'Explorar biblioteca'}</button></div><section class="stats">${stats.map(s=>`<div class="stat"><strong>${s[0]}</strong><span>${s[1]}</span></div>`).join('')}</section><div class="grid"><section class="card"><h2>Acciones rápidas</h2><span class="muted">Accesos frecuentes</span><div class="quickgrid">${['Grupos','Aulas','Biblioteca','Temas'].map((x,i)=>`<button class="quick" onclick="go('${x}')"><b>${x}</b><small>${['Organiza tus grupos','Gestiona tus aulas','Consulta materiales','Planifica contenidos'][i]}</small></button>`).join('')}</div></section><section class="card"><h2>Actividad reciente</h2><span class="muted">Información actualizada</span><div class="activity"><div><b>Material actualizado</b><p>Comunicación - Comprensión lectora</p></div><div><b>Grupo organizado</b><p>3.º de Secundaria · Aula B</p></div><div><b>Tema pendiente de validar</b><p>Identidad cultural</p></div></div></section></div><section class="card" style="margin-top:18px;background:#edf6f1"><b>Consejo de accesibilidad</b><p class="muted">Usa lenguaje claro, etiquetas descriptivas y suficiente contraste para una experiencia educativa inclusiva.</p></section>`}
function library(){let list=mats.filter(m=>m.join(' ').toLowerCase().includes(query.toLowerCase()));return `<div class="title"><div><div class="eyebrow">RECURSOS EDUCATIVOS</div><h1>Biblioteca</h1><p>Consulta y organiza materiales por nivel, área y tema.</p></div></div><div class="searchbar"><input placeholder="Buscar materiales..." value="${query}" oninput="query=this.value;render()"><button class="primary">Nivel ▾</button><button class="primary">Área ▾</button></div>${role==='Docente'?`<div class="upload"><b>Agregar material</b><p class="muted">Selecciona un PDF, PPT, DOC u otro recurso educativo.</p><input type="file" accept=".pdf,.ppt,.pptx,.doc,.docx" onchange="upload(this)"></div>`:''}<div class="materials">${list.map(m=>`<article class="material"><span class="badge">${m[0]}</span><h3>${m[1]}</h3><p>${m[2]} · ${m[3]}</p><button class="primary" onclick="toast('Abriendo ${m[1]}')">Ver material</button></article>`).join('')}</div>`}
function management(){let items=data[page]||[];return `<div class="title"><div><div class="eyebrow">${role.toUpperCase()} · ORGANIZACIÓN</div><h1>${page}</h1><p>Administra y configura esta sección educativa.</p></div><button class="primary" onclick="toast('Formulario de ${page} listo')">＋ Agregar</button></div><section class="rows">${items.map((x,i)=>`<div class="row"><div><b>${x}</b><small>${page==='Niveles'&&i===2?'Pendiente de validación':'Configurado en la plataforma'}</small></div><button onclick="toast('Opciones de ${x}')">•••</button></div>`).join('')}</section>`}
function login(){app.innerHTML=`<div class="login"><div class="loginbox"><div class="logo"><span class="mark">P</span><div>PACHAADAPT<small>BY YACHAY</small></div></div><div class="eyebrow" style="margin-top:25px">PLATAFORMA EDUCATIVA</div><h1>Aprender, adaptar y avanzar juntos.</h1><p>Un espacio pensado para acompañar a docentes y estudiantes con una experiencia sencilla y accesible.</p><label>Correo electrónico<input placeholder="usuario@ejemplo.com"></label><label>Contraseña<input type="password" placeholder="••••••••"></label><label>Ingresar como<select id="loginrole"><option>Docente</option><option>Estudiante</option><option>Administrador</option></select></label><button class="primary wide" onclick="role=document.getElementById('loginrole').value;page='Inicio';render()">Iniciar sesión</button></div></div>`}
function go(p){page=p;open=false;render()}function setRole(r){role=r;page='Inicio';render()}function setLang(x){lang=x;toast('Idioma cambiado a '+x)}function toggleSide(){open=!open;render()}function upload(el){if(el.files[0]){let n=el.files[0].name,t=(n.split('.').pop()||'FILE').toUpperCase();mats.unshift([t,n,'Pendiente de clasificar','Por validar']);toast('Material agregado a la biblioteca')}}
render();
</script></body></html>
